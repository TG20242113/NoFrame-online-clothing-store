<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoFrame — Fashion Without Limits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F5F2EA;
  --bone-2:#EFEBE0;
  --ink:#16171A;
  --ink-soft:#5B5C58;
  --line:#DAD4C4;
  --accent:#E8402F;
  --accent-ink:#fff;
  --white:#FFFFFF;
  --sale:#C0392B;
  --ok:#3C6E47;
  --radius:2px;
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bone);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
.mono{font-family:'Space Mono',monospace;}
.serif{font-family:'Fraunces',serif;}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
.wrap{max-width:1400px;margin:0 auto;padding:0 32px;}
@media(max-width:768px){.wrap{padding:0 16px;}}

/* ---------- HEADER ---------- */
#site-header{position:sticky;top:0;z-index:500;background:rgba(245,242,234,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 32px;max-width:1400px;margin:0 auto;}
@media(max-width:768px){.header-top{padding:12px 16px;}}
.logo{font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;}
.logo-mark{width:26px;height:26px;flex-shrink:0;}
.logo-mark rect,.logo-mark path{stroke:var(--ink);}
.logo-light .logo-mark rect,.logo-light .logo-mark path{stroke:var(--bone);}
.header-nav{display:flex;gap:28px;align-items:center;}
.header-nav a{font-size:13px;letter-spacing:.03em;font-weight:500;position:relative;padding:4px 0;white-space:nowrap;}
.header-nav a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1.4px;background:var(--ink);transition:width .25s var(--ease);}
.header-nav a:hover::after{width:100%;}
.header-nav a.sale-link{color:var(--accent);}
.header-actions{display:flex;align-items:center;gap:18px;}
.icon-btn{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;transition:opacity .2s;}
.icon-btn:hover{opacity:.6;}
.icon-btn svg{width:19px;height:19px;}
.badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;}
.search-wrap{flex:1;max-width:360px;position:relative;display:none;}
@media(min-width:1000px){.search-wrap{display:block;}}
.search-wrap input{width:100%;background:var(--bone-2);border:1px solid var(--line);padding:9px 14px 9px 34px;font-size:13px;border-radius:20px;outline:none;transition:border .2s;}
.search-wrap input:focus{border-color:var(--ink);}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.5;}
.mobile-menu-btn{display:none;}
@media(max-width:999px){.header-nav{display:none;} .mobile-menu-btn{display:flex;} .search-wrap{display:none;}}
#mobile-drawer{position:fixed;inset:0;background:var(--bone);z-index:900;transform:translateX(100%);transition:transform .3s var(--ease);padding:20px;overflow-y:auto;}
#mobile-drawer.open{transform:translateX(0);}
#mobile-drawer a{display:block;padding:14px 0;font-size:18px;font-family:'Fraunces',serif;border-bottom:1px solid var(--line);}
#mobile-drawer .close-drawer{margin-bottom:20px;}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:1px;transition:all .22s var(--ease);}
.btn-primary{background:var(--ink);color:var(--bone);}
.btn-primary:hover{background:var(--accent);}
.btn-outline{border:1px solid var(--ink);color:var(--ink);}
.btn-outline:hover{background:var(--ink);color:var(--bone);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{opacity:.85;}
.btn-sm{padding:9px 16px;font-size:11px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{text-decoration:underline;text-underline-offset:3px;font-size:12px;font-weight:500;}

/* ---------- HERO SLIDER ---------- */
.hero{position:relative;height:88vh;min-height:520px;overflow:hidden;background:var(--ink);}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease);background-size:cover;background-position:center;}
.hero-slide.active{opacity:1;}
.hero-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 55%);}
.hero-content{position:absolute;left:0;bottom:0;padding:0 32px 64px;color:#fff;z-index:2;max-width:640px;}
@media(max-width:768px){.hero-content{padding:0 16px 44px;}}
.hero-content .eyebrow{color:rgba(255,255,255,.75);margin-bottom:14px;}
.hero-content h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(34px,6vw,68px);line-height:1.02;margin-bottom:16px;}
.hero-content p{font-size:15px;color:rgba(255,255,255,.85);margin-bottom:26px;max-width:420px;}
.hero-nav{position:absolute;bottom:64px;right:32px;display:flex;gap:10px;z-index:3;}
@media(max-width:768px){.hero-nav{right:16px;bottom:20px;}}
.hero-arrow{width:42px;height:42px;border:1px solid rgba(255,255,255,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .2s;}
.hero-arrow:hover{background:#fff;color:var(--ink);}
.hero-dots{position:absolute;left:32px;bottom:24px;display:flex;gap:8px;z-index:3;}
@media(max-width:768px){.hero-dots{left:16px;}}
.hero-dot{width:22px;height:2px;background:rgba(255,255,255,.4);transition:background .2s;}
.hero-dot.active{background:#fff;}

/* ---------- SECTIONS ---------- */
.section{padding:88px 0;}
@media(max-width:768px){.section{padding:52px 0;}}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px;gap:16px;}
.section-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(26px,3.4vw,42px);}
.section-head .eyebrow{margin-bottom:8px;}

/* ---------- CATEGORY GRID ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);}
@media(max-width:900px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
.cat-card{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--ink);cursor:pointer;}
.cat-card img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease);opacity:.82;}
.cat-card:hover img{transform:scale(1.06);opacity:1;}
.cat-card .cat-label{position:absolute;left:18px;bottom:18px;color:#fff;z-index:2;}
.cat-card .cat-label .eyebrow{color:rgba(255,255,255,.7);}
.cat-card .cat-label h3{font-family:'Fraunces',serif;font-size:22px;font-weight:500;margin-top:2px;}
.cat-card .explore{margin-top:10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:2px;}
.cat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 60%);z-index:1;}

/* ---------- PRODUCT GRID / CARD (signature: frame-on-hover) ---------- */
.tabs{display:flex;gap:22px;margin-bottom:6px;flex-wrap:wrap;}
.tab-btn{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);padding-bottom:6px;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--ink);border-color:var(--accent);}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px;}
@media(max-width:1100px){.product-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:720px){.product-grid{grid-template-columns:repeat(2,1fr);gap:18px 12px;}}
.product-card{cursor:pointer;}
.pc-frame{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--bone-2);margin-bottom:12px;}
.pc-frame img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);}
.product-card:hover .pc-frame img{transform:scale(1.045);}
.pc-corner{position:absolute;width:16px;height:16px;border-color:#fff;opacity:0;transition:all .3s var(--ease);}
.pc-corner.tl{top:10px;left:10px;border-top:1.5px solid;border-left:1.5px solid;transform:translate(6px,6px);}
.pc-corner.tr{top:10px;right:10px;border-top:1.5px solid;border-right:1.5px solid;transform:translate(-6px,6px);}
.pc-corner.bl{bottom:10px;left:10px;border-bottom:1.5px solid;border-left:1.5px solid;transform:translate(6px,-6px);}
.pc-corner.br{bottom:10px;right:10px;border-bottom:1.5px solid;border-right:1.5px solid;transform:translate(-6px,-6px);}
.product-card:hover .pc-corner{opacity:1;transform:translate(0,0);}
.pc-tag{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bone);font-family:'Space Mono',monospace;font-size:10px;padding:4px 8px;letter-spacing:.05em;z-index:2;}
.pc-tag.sale{background:var(--accent);color:#fff;}
.pc-wish{position:absolute;top:10px;right:10px;width:30px;height:30px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .2s;}
.pc-wish:hover{transform:scale(1.1);}
.pc-wish svg{width:15px;height:15px;}
.pc-wish.active svg{fill:var(--accent);stroke:var(--accent);}
.pc-actions{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;opacity:0;transform:translateY(8px);transition:all .25s var(--ease);z-index:2;}
.product-card:hover .pc-actions{opacity:1;transform:translateY(0);}
.pc-actions button{flex:1;background:#fff;padding:9px 6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.pc-actions button:hover{background:var(--ink);color:#fff;}
.pc-info h4{font-size:13.5px;font-weight:500;margin-bottom:4px;}
.pc-meta{display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:12.5px;}
.pc-price-old{text-decoration:line-through;color:var(--ink-soft);font-size:11.5px;}
.pc-price-sale{color:var(--sale);}
.pc-stars{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
.pc-colors{display:flex;gap:4px;margin-top:7px;}
.pc-colors span{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}

/* ---------- BANNER STRIP ---------- */
.promo-strip{background:var(--ink);color:var(--bone);padding:64px 0;text-align:center;}
.promo-strip h3{font-family:'Fraunces',serif;font-size:clamp(24px,3vw,36px);font-weight:500;margin-bottom:10px;}
.promo-strip p{color:rgba(245,242,234,.7);margin-bottom:22px;font-size:14px;}

/* ---------- FOOTER ---------- */
footer{background:var(--ink);color:var(--bone);padding:72px 0 24px;}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.3fr;gap:32px;padding-bottom:52px;border-bottom:1px solid rgba(245,242,234,.15);}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h5{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px;color:rgba(245,242,234,.55);}
.footer-grid a,.footer-grid p{display:block;font-size:13.5px;margin-bottom:11px;color:rgba(245,242,234,.85);}
.footer-grid a:hover{color:var(--accent);}
.newsletter-form{display:flex;border-bottom:1px solid rgba(245,242,234,.4);margin-top:6px;}
.newsletter-form input{flex:1;background:none;border:none;padding:10px 0;color:#fff;font-size:13px;outline:none;}
.newsletter-form input::placeholder{color:rgba(245,242,234,.5);}
.newsletter-form button{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.social-row{display:flex;gap:14px;margin-top:18px;}
.social-row a{width:32px;height:32px;border:1px solid rgba(245,242,234,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:0;}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:22px;font-size:12px;color:rgba(245,242,234,.5);flex-wrap:wrap;gap:10px;}

/* ---------- GENERIC PAGE ---------- */
.page{padding:44px 0 90px;}
.breadcrumb{font-size:11.5px;color:var(--ink-soft);margin-bottom:22px;display:flex;gap:6px;align-items:center;font-family:'Space Mono',monospace;}
.page-title{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,44px);font-weight:500;margin-bottom:8px;}

/* ---------- FILTER LAYOUT ---------- */
.listing{display:grid;grid-template-columns:230px 1fr;gap:40px;}
@media(max-width:900px){.listing{grid-template-columns:1fr;}}
.filter-block{margin-bottom:28px;}
.filter-block h5{font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px;font-weight:700;}
.filter-opt{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:10px;color:var(--ink-soft);cursor:pointer;}
.filter-opt input{accent-color:var(--ink);}
.filter-opt:hover{color:var(--ink);}
.price-range{display:flex;align-items:center;gap:8px;}
.price-range input[type=range]{width:100%;accent-color:var(--accent);}
.color-swatches{display:flex;flex-wrap:wrap;gap:8px;}
.swatch-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid transparent;cursor:pointer;position:relative;}
.swatch-btn.selected{border-color:var(--ink);}
.listing-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.result-count{font-size:13px;color:var(--ink-soft);}
select.sort-select{border:1px solid var(--line);background:var(--white);padding:9px 12px;font-size:12.5px;border-radius:2px;}

/* ---------- PRODUCT DETAIL ---------- */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;}
@media(max-width:900px){.pd-grid{grid-template-columns:1fr;gap:28px;}}
.pd-gallery-main{aspect-ratio:3/4;overflow:hidden;background:var(--bone-2);margin-bottom:10px;cursor:zoom-in;position:relative;}
.pd-gallery-main img{width:100%;height:100%;object-fit:cover;transition:transform .25s;}
.pd-gallery-main.zoomed img{transform:scale(1.7);cursor:zoom-out;}
.pd-thumbs{display:flex;gap:8px;}
.pd-thumbs img{width:70px;height:88px;object-fit:cover;cursor:pointer;opacity:.55;border:1px solid transparent;}
.pd-thumbs img.active{opacity:1;border-color:var(--ink);}
.pd-title{font-family:'Fraunces',serif;font-size:30px;font-weight:500;margin-bottom:6px;}
.pd-stars{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
.pd-price{font-family:'Space Mono',monospace;font-size:22px;margin-bottom:20px;display:flex;gap:12px;align-items:center;}
.pd-desc{font-size:13.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:26px;}
.pd-row{margin-bottom:22px;}
.pd-row label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:10px;}
.size-grid{display:flex;gap:8px;flex-wrap:wrap;}
.size-btn{min-width:44px;height:44px;padding:0 12px;border:1px solid var(--line);font-size:12.5px;font-weight:600;transition:all .18s;}
.size-btn.selected{border-color:var(--ink);background:var(--ink);color:#fff;}
.color-grid{display:flex;gap:10px;}
.qty-stepper{display:flex;align-items:center;border:1px solid var(--line);width:fit-content;}
.qty-stepper button{width:36px;height:40px;font-size:15px;}
.qty-stepper span{width:36px;text-align:center;font-family:'Space Mono',monospace;}
.pd-cta-row{display:flex;gap:10px;margin-bottom:18px;}
.stock-line{font-size:12px;color:var(--ok);margin-bottom:22px;display:flex;align-items:center;gap:6px;}
.stock-line.low{color:var(--accent);}
.info-accordion{border-top:1px solid var(--line);}
.acc-item{border-bottom:1px solid var(--line);}
.acc-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:13px;font-weight:600;cursor:pointer;}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s var(--ease);font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
.acc-body.open{max-height:220px;padding-bottom:16px;}

/* AI size modal */
.ai-btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border:1px dashed var(--ink-soft);padding:9px 14px;}
.ai-btn:hover{border-color:var(--accent);color:var(--accent);}
.modal-overlay{position:fixed;inset:0;background:rgba(20,19,16,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--bone);max-width:460px;width:100%;max-height:88vh;overflow-y:auto;padding:32px;position:relative;transform:translateY(14px);transition:transform .25s var(--ease);}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-close{position:absolute;top:16px;right:16px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.modal h3{font-family:'Fraunces',serif;font-size:22px;margin-bottom:6px;}
.modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;}
.form-row{margin-bottom:16px;}
.form-row label{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:7px;}
.form-row input,.form-row select{width:100%;border:1px solid var(--line);padding:11px 12px;font-size:13px;background:#fff;border-radius:2px;}
.seg-row{display:flex;gap:8px;}
.seg-btn{flex:1;border:1px solid var(--line);padding:10px;font-size:12px;text-align:center;}
.seg-btn.selected{border-color:var(--ink);background:var(--ink);color:#fff;}
.ai-result{background:var(--white);border:1px solid var(--line);padding:22px;margin-top:6px;}
.ai-result .big{font-family:'Fraunces',serif;font-size:38px;color:var(--accent);}
.ai-result .conf{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.alt-row{display:flex;gap:10px;margin:14px 0;}
.alt-chip{flex:1;border:1px solid var(--line);padding:10px;text-align:center;font-size:11.5px;}
.alt-chip b{display:block;font-family:'Space Mono',monospace;font-size:16px;}
.ai-explain{font-size:12px;color:var(--ink-soft);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}

/* ---------- CART ---------- */
.cart-grid{display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:start;}
@media(max-width:900px){.cart-grid{grid-template-columns:1fr;}}
.cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);}
.cart-item img{width:90px;height:112px;object-fit:cover;}
.cart-item h4{font-size:14px;margin-bottom:4px;}
.cart-item .meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.cart-item .price-col{text-align:right;font-family:'Space Mono',monospace;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.remove-link{font-size:11px;color:var(--ink-soft);text-decoration:underline;}
.remove-link:hover{color:var(--accent);}
.summary-card{background:var(--white);border:1px solid var(--line);padding:26px;}
.summary-card h3{font-family:'Fraunces',serif;font-size:19px;margin-bottom:18px;}
.summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;color:var(--ink-soft);}
.summary-row.total{color:var(--ink);font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}
.empty-state{text-align:center;padding:80px 20px;}
.empty-state svg{width:52px;height:52px;margin:0 auto 18px;opacity:.3;}

/* ---------- CHECKOUT ---------- */
.steps-row{display:flex;gap:0;margin-bottom:40px;flex-wrap:wrap;}
.step-pill{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:10px 18px 10px 0;position:relative;}
.step-pill .num{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;}
.step-pill.active{color:var(--ink);}
.step-pill.active .num{background:var(--ink);color:#fff;border-color:var(--ink);}
.step-pill.done .num{background:var(--ok);color:#fff;border-color:var(--ok);}

<script>
/* ============================================================
   NOFRAME — front-end e-commerce demo (mock data, in-memory
   + window.storage persistence for cart/wishlist/orders/admin data)
   ============================================================ */

/* ---------------- DATA ---------------- */
const COLORS = {black:'#181818',white:'#f2f2f2',beige:'#D8C4A0',olive:'#6B7150',navy:'#22314F',red:'#B23A2E',rose:'#D9A0A0',grey:'#8C8C8C',mustard:'#D6A937',brown:'#6B4A34'};

/* ---------------- FIXED FASHION IMAGE SYSTEM ----------------
   Uses stable, category-specific clothing images instead of loremflickr,
   which could return unrelated or random photos. */
const IMAGE_SETS = {
  men: [
    'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85',
    'https://images.unsplash.com/photo-1490578474895-699cd4e2cf59?auto=format&fit=crop&w=900&q=85',

  ],

    'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85'
  ],
  kids: [
    'https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?auto=format&fit=crop&w=900&q=85',

  ],

    'https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&w=900&q=85',
    'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=85'
  ],

    'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=900&q=85',

    'https://images.unsplash.com/photo-1534215754734-18e55d13e346?auto=format&fit=crop&w=900&q=85',
    'https://images.unsplash.com/photo-1575428652377-a2d80e2277fc?auto=format&fit=crop&w=900&q=85'
  ]
};

const HERO_IMAGES = [
  'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1800&q=90',
  'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1800&q=90',

];

const CATEGORY_IMAGES = {
  men: IMAGE_SETS.men[1],
  women: IMAGE_SETS.women[0],
  kids: IMAGE_SETS.kids[0],
  bags: IMAGE_SETS.bags[0],
  caps: IMAGE_SETS.caps[0]
};

function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return h;
}

function generateProductImage(category, seedKey, w, h){
  const set = IMAGE_SETS[category] || IMAGE_SETS.men;
  const index = hashStr(category+'-'+seedKey) % set.length;
  return set[index];
}

function getCategoryImage(category){
  return CATEGORY_IMAGES[category] || IMAGE_SETS.men[0];
}

const FALLBACK_TINTS = {
  men:'#E9E3D9',women:'#EFEBE0',kids:'#E6E0D2',bags:'#EAE2D3',caps:'#EDE6D6'
};

function fallbackImg(category,w,h){
  w=w||700; h=h||900;
  const tint=FALLBACK_TINTS[category]||'#EDEAE0';
  const label=category==='kids'?'Kids Fashion':(category||'Fashion');
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'><rect width='${w}' height='${h}' fill='${tint}'/><text x='50%' y='50%' font-family='sans-serif' font-size='${Math.round(w*0.06)}' fill='#16171A' opacity='0.55' text-anchor='middle' dominant-baseline='middle'>NoFrame — ${label}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

function imgFallback(el,category,w,h){
  el.onerror=null;
  el.src=fallbackImg(category,w,h);
}

function refreshOldProductImages(){
  DB.products.forEach(p=>{
    if(!Array.isArray(p.images) || !p.images.length || p.images.some(im=>String(im).includes('loremflickr.com'))){
      p.images=[0,1,2,3].map(k=>generateProductImage(p.category,p.title+'-'+k,700,900));
    }
  });
}

function seedProducts(){
  const cats = [
    {id:'men',name:"Men's Fashion"},{id:'women',name:"Women's Fashion"},
    {id:'kids',name:"Children's Fashion"},{id:'bags',name:'Bags'},
    {id:'caps',name:'Caps'}
  ];
  const names = {
    men:['Oversized Wool Coat','Structured Denim Jacket','Tapered Chino Trouser','Merino Crewneck','Cargo Utility Pant','Linen Resort Shirt'],
    women:['Draped Satin Slip Dress','Tailored Wide-Leg Trouser','Cropped Knit Cardigan','Belted Trench Coat','Pleated Midi Skirt','Silk Camisole Top'],
    kids:['Junior Puffer Jacket','Cotton Graphic Tee Set','Kids Corduroy Overalls','Rain Shell Jacket','Fleece Zip Hoodie','Stretch Jogger Pant'],
    bags:['Structured Leather Tote','Mini Crossbody Bag','Canvas Weekender','Woven Shoulder Bag','Nylon Belt Bag','Soft Hobo Bag'],
    caps:['Classic Wool Cap','Corduroy Bucket Hat','Structured Snapback','Washed Canvas Cap','Fleece Beanie','Nylon Trucker Cap']
  };
  let id=1; const products=[];
  cats.forEach(cat=>{
    names[cat.id].forEach((n,i)=>{
      const price = Math.round((45+Math.random()*180));
      const onSale = Math.random()<0.3;
      const isNew = Math.random()<0.35;
      const best = Math.random()<0.3;
      const trend = Math.random()<0.25;
      const colorKeys = Object.keys(COLORS).sort(()=>0.5-Math.random()).slice(0,3+Math.floor(Math.random()*2));
      const imgs = [0,1,2,3].map(k=>generateProductImage(cat.id, n+'-'+k, 700, 900));
      products.push({
        id:'P'+(id++),
        title:n,
        category:cat.id,
        categoryName:cat.name,
        price,
        discountPrice: onSale? Math.round(price*(0.6+Math.random()*0.2)) : null,
        colors: colorKeys,
        sizes: cat.id==='kids' ? ['2Y','4Y','6Y','8Y','10Y'] : ['XS','S','M','L','XL'],
        images: imgs,
        rating:(3.5+Math.random()*1.5).toFixed(1),
        reviewsCount: Math.floor(Math.random()*180)+3,
        stock: Math.floor(Math.random()*40),
        tags:[...(isNew?['new']:[]),...(best?['bestseller']:[]),...(onSale?['sale']:[]),...(trend?['trending']:[])],
        description:`A NoFrame signature piece — ${n.toLowerCase()} crafted from premium materials, designed for everyday movement with a considered, modern silhouette. Cut for a relaxed fit and finished with tonal stitching.`,
        createdAt: Date.now() - Math.floor(Math.random()*9000000000)
      });
    });
  });
  return {cats, products};
}

const {cats:SEED_CATS, products:SEED_PRODUCTS} = seedProducts();

/* ---------------- STATE ---------------- */
let DB = {
  categories: SEED_CATS,
  products: SEED_PRODUCTS,
  orders: [],
  reviews: [],
  users: [{id:'U1',name:'Demo Customer',email:'demo@noframe.com',password:'demo123',phone:'',address:'',role:'customer',promo:true}]
};
let SESSION = {user:null, cart:[], wishlist:[]};
let VIEW = {gallery:0, selColor:null, selSize:null, qty:1, zoom:false, checkoutStep:1, orderJustPlaced:null, adminTab:'overview', drawerOpen:false, editingProduct:null, editingCategory:null};

/* ---------------- STORAGE (persist cart/wishlist/session db) ---------------- */
async function loadStorage(){
  try{
    const d = await window.storage.get('noframe-db', true);
    if(d && d.value) DB = JSON.parse(d.value);
    refreshOldProductImages();
    await saveDB();
  }catch(e){ /* first run, seed */ await saveDB(); }
  try{
    const s = await window.storage.get('noframe-session', false);
    if(s && s.value) SESSION = JSON.parse(s.value);
  }catch(e){ /* no session yet */ }
}
async function saveDB(){
  try{ await window.storage.set('noframe-db', JSON.stringify(DB), true); }catch(e){console.error(e);}
}
async function saveSession(){
  try{ await window.storage.set('noframe-session', JSON.stringify(SESSION), false); }catch(e){console.error(e);}
}

/* ---------------- HELPERS ---------------- */

const money = n => '$'+Number(n).toFixed(2);
function toast(msg){
  const t=$('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(window.__toastT); window.__toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function nav(hash){ location.hash = hash; }
function stars(rating){
  const r = Math.round(rating);
  return '<span class="star">'+'★'.repeat(r)+'</span>'+'☆'.repeat(5-r);
}
function findProduct(id){ return DB.products.find(p=>p.id===id); }
function cartCount(){ return SESSION.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return SESSION.cart.reduce((s,i)=>{const p=findProduct(i.productId); const price=p.discountPrice||p.price; return s+price*i.qty;},0); }

/* ---------------- LISTING (category / new / sale / search) ---------------- */
let FILTER = {price:400, colors:[], sizes:[], sort:'newest', catFilter:new Set()};
function applyFilters(list){
  let out = list.filter(p=>(p.discountPrice||p.price)<=FILTER.price);
  if(FILTER.colors.length) out = out.filter(p=>p.colors.some(c=>FILTER.colors.includes(c)));
  if(FILTER.sizes.length) out = out.filter(p=>p.sizes.some(s=>FILTER.sizes.includes(s)));
  if(FILTER.catFilter.size) out = out.filter(p=>FILTER.catFilter.has(p.category));
  switch(FILTER.sort){
    case 'price-asc': out.sort((a,b)=>(a.discountPrice||a.price)-(b.discountPrice||b.price)); break;
    case 'price-desc': out.sort((a,b)=>(b.discountPrice||b.price)-(a.discountPrice||a.price)); break;
    case 'rating': out.sort((a,b)=>b.rating-a.rating); break;
    case 'popular': out.sort((a,b)=>b.reviewsCount-a.reviewsCount); break;
    default: out.sort((a,b)=>b.createdAt-a.createdAt);
  }
  return out;
}
function renderListing(title, baseList, opts={}){
  const list = applyFilters(baseList);
  const allColors = Object.keys(COLORS);

            <option value="newest" ${FILTER.sort==='newest'?'selected':''}>Newest Products</option>

let AI_STATE = {height:170,weight:65,fit:'Regular',gender:'Unisex',pid:null};
function openAiSize(pid){
  AI_STATE.pid = pid;
  $('#modal-root').innerHTML = `
  <div class="modal-overlay open" id="ai-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>

      <div id="ai-form">
        <div class="form-row"><label>Height (cm)</label><input type="number" id="ai-height" value="${AI_STATE.height}"></div>
        <div class="form-row"><label>Weight (kg)</label><input type="number" id="ai-weight" value="${AI_STATE.weight}"></div>
        <div class="form-row"><label>Preferred Fit</label>
          <div class="seg-row" id="ai-fit-row">
            ${['Slim','Regular','Loose'].map(f=>`<button class="seg-btn ${f===AI_STATE.fit?'selected':''}" onclick="setAiFit('${f}')">${f}</button>`).join('')}
          </div>
        </div>
        <div class="form-row"><label>Category</label>
          <select id="ai-gender">
            <option>Unisex</option><option>Men</option><option>Women</option><option>Kids</option>
          </select>
        </div>
        <button class="btn btn-accent btn-full" onclick="runAiSize()">Get My Recommendation</button>
      </div>
      <div id="ai-result-slot"></div>
    </div>
  </div>`;
}
function setAiFit(f){ AI_STATE.fit=f; document.querySelectorAll('#ai-fit-row .seg-btn').forEach(b=>b.classList.toggle('selected',b.textContent===f)); }
function closeModal(){ $('#modal-root').innerHTML=''; }
function runAiSize(){
  const h = +$('#ai-height').value, w = +$('#ai-weight').value, fit = AI_STATE.fit;
  const bmi = w/((h/100)**2);
  const sizes = ['XS','S','M','L','XL'];
  let idx = 2; // M baseline
  if(bmi<19) idx=0; else if(bmi<21.5) idx=1; else if(bmi<25) idx=2; else if(bmi<29) idx=3; else idx=4;
  if(fit==='Slim') idx=Math.max(0,idx-1);
  if(fit==='Loose') idx=Math.min(4,idx+1);
  const best = sizes[idx];
  const slim = sizes[Math.max(0,idx-1)];
  const loose = sizes[Math.min(4,idx+1)];
  const conf = Math.min(97, 78 + Math.round(Math.random()*15));

async function placeOrder(){

  const order = {
    id:'NF'+Date.now().toString().slice(-8),
    userId: SESSION.user?SESSION.user.id:'guest',

async function doLogin(){
  const email=$('#au-email').value, pass=$('#au-pass').value;
  const u = DB.users.find(u=>u.email===email && u.password===pass);
  if(!u){ toast('Invalid email or password'); return; }
  SESSION.user=u; await saveSession(); toast('Welcome back, '+u.name); nav('#/profile');
}
async function doSignup(){
  const name=$('#au-name').value, email=$('#au-email').value, phone=$('#au-phone').value, pass=$('#au-pass').value;
  if(!name||!email||!pass){ toast('Please fill in all fields'); return; }
  if(DB.users.find(u=>u.email===email)){ toast('An account with this email already exists'); return; }
  const u = {id:'U'+Date.now(), name, email, phone, password:pass, address:'', role:'customer', promo:$('#au-promo').checked};
  DB.users.push(u); await saveDB();
  SESSION.user=u; await saveSession();
  toast('Account created — welcome to NoFrame!'); nav('#/profile');
}

    <tbody>${lowStock.slice(0,8).map(p=>`<tr><td>${p.title}</td><td>${p.categoryName}</td><td class="mono" style="color:var(--accent);">${p.stock}</td></tr>`).join('')}</tbody></table>
  </div>`;
}
function adminProducts(){
  return `
  <div class="admin-topbar"><h2 class="serif" style="font-size:26px;">Product Management</h2><button class="btn btn-primary btn-sm" onclick="openProductForm()">+ Add Product</button></div>
  <div class="admin-panel" style="padding:0;">
    <table class="admin-table">
      <thead><tr><th></th><th>Title</th><th>Category</th><th>Price</th><th>Stock</th><th>Colors</th><th>Sizes</th><th></th></tr></thead>
      <tbody>${DB.products.map(p=>`
        <tr>
          <td><img src="${p.images[0]}" onerror="imgFallback(this,'${p.category}')"></td>
          <td>${p.title}</td>
          <td>${p.categoryName}</td>
          <td class="mono">${p.discountPrice?money(p.discountPrice):money(p.price)}</td>
          <td class="mono">${p.stock}</td>
          <td>${p.colors.length}</td>
          <td>${p.sizes.length}</td>
          <td><a class="icon-link" onclick="openProductForm('${p.id}')">Edit</a><a class="icon-link danger" onclick="deleteProduct('${p.id}')">Delete</a></td>
        </tr>`).join('')}</tbody>
    </table>
  </div>
  <div id="product-form-slot"></div>`;
}
function openProductForm(id){
  const p = id?findProduct(id):null;
  VIEW.editingProduct = id||null;
  const html = `
  <div class="admin-panel">
    <h3>${p?'Edit Product':'Add Product'}</h3>
    <div class="form-2col">
      <div class="form-row"><label>Title</label><input id="pf-title" value="${p?p.title:''}"></div>
      <div class="form-row"><label>Category</label><select id="pf-cat">${DB.categories.map(c=>`<option value="${c.id}" ${p&&p.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="form-row"><label>Price ($)</label><input id="pf-price" type="number" value="${p?p.price:''}"></div>
      <div class="form-row"><label>Discount Price ($, optional)</label><input id="pf-dprice" type="number" value="${p&&p.discountPrice?p.discountPrice:''}"></div>
      <div class="form-row"><label>Stock Quantity</label><input id="pf-stock" type="number" value="${p?p.stock:20}"></div>
      <div class="form-row"><label>Image URL</label><input id="pf-image" value="${p?p.images[0]:generateProductImage('men','new'+Date.now(),700,900)}"></div>
      <div class="form-row"><label>Colors (comma separated)</label><input id="pf-colors" value="${p?p.colors.join(','):'black,white'}"></div>
      <div class="form-row"><label>Sizes (comma separated)</label><input id="pf-sizes" value="${p?p.sizes.join(','):'S,M,L,XL'}"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
      <button class="btn btn-outline" onclick="$('#product-form-slot').innerHTML=''">Cancel</button>
    </div>
  </div>`;
  $('#product-form-slot').innerHTML = html;
  $('#product-form-slot').scrollIntoView({behavior:'smooth'});
}
async function saveProduct(){
  const cat = DB.categories.find(c=>c.id===$('#pf-cat').value);
  const data = {
    title:$('#pf-title').value, category:cat.id, categoryName:cat.name,
    price:+$('#pf-price').value, discountPrice: $('#pf-dprice').value?+$('#pf-dprice').value:null,
    stock:+$('#pf-stock').value, images:[$('#pf-image').value,$('#pf-image').value],
    colors:$('#pf-colors').value.split(',').map(s=>s.trim()).filter(Boolean),
    sizes:$('#pf-sizes').value.split(',').map(s=>s.trim()).filter(Boolean)
  };
  if(!data.title||!data.price){ toast('Title and price are required'); return; }
  if(VIEW.editingProduct){
    const idx = DB.products.findIndex(p=>p.id===VIEW.editingProduct);
    DB.products[idx] = {...DB.products[idx], ...data};
  } else {
    DB.products.unshift({
      id:'P'+Date.now(), ...data, rating:'4.5', reviewsCount:0, tags:['new'],
      description:'A NoFrame signature piece, added by the admin team.', createdAt:Date.now()
    });
  }
  await saveDB(); toast('Product saved ✓'); renderAdmin('products');
}
async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  DB.products = DB.products.filter(p=>p.id!==id); await saveDB(); toast('Product deleted'); renderAdmin('products');
}
function adminCategories(){
  return `
  <div class="admin-topbar"><h2 class="serif" style="font-size:26px;">Category Management</h2><button class="btn btn-primary btn-sm" onclick="openCategoryForm()">+ Add Category</button></div>
  <div class="admin-panel" style="padding:0;">
    <table class="admin-table"><thead><tr><th>Name</th><th>ID</th><th>Products</th><th></th></tr></thead>
    <tbody>${DB.categories.map(c=>`<tr><td>${c.name}</td><td class="mono">${c.id}</td><td>${DB.products.filter(p=>p.category===c.id).length}</td><td><a class="icon-link" onclick="openCategoryForm('${c.id}')">Edit</a><a class="icon-link danger" onclick="deleteCategory('${c.id}')">Delete</a></td></tr>`).join('')}</tbody></table>
  </div>
  <div id="cat-form-slot"></div>`;
}
function openCategoryForm(id){
  const c = id?DB.categories.find(x=>x.id===id):null;
  VIEW.editingCategory = id||null;
  $('#cat-form-slot').innerHTML = `
  <div class="admin-panel">
    <h3>${c?'Edit Category':'Add Category'}</h3>
    <div class="form-2col">
      <div class="form-row"><label>Name</label><input id="cf-name" value="${c?c.name:''}"></div>
      <div class="form-row"><label>ID (slug, no spaces)</label><input id="cf-id" value="${c?c.id:''}" ${c?'disabled':''}></div>
    </div>
    <button class="btn btn-primary" onclick="saveCategory()">Save Category</button>
  </div>`;
}
async function saveCategory(){
  const name = $('#cf-name').value, id = $('#cf-id').value.trim().toLowerCase().replace(/\\s+/g,'-');
  if(!name||!id){toast('Name and ID required');return;}
  if(VIEW.editingCategory){
    const cat = DB.categories.find(c=>c.id===VIEW.editingCategory); cat.name=name;
    DB.products.filter(p=>p.category===cat.id).forEach(p=>p.categoryName=name);
  } else {
    if(DB.categories.find(c=>c.id===id)){toast('A category with this ID already exists');return;}
    DB.categories.push({id,name});
    if(!CAT_KEYWORDS[id]) CAT_KEYWORDS[id]=CAT_KEYWORDS.men;
  }
  await saveDB(); toast('Category saved ✓'); renderAdmin('categories');
}
async function deleteCategory(id){
  if(!confirm('Delete this category? Products in it will remain but be uncategorised.')) return;
  DB.categories = DB.categories.filter(c=>c.id!==id); await saveDB(); toast('Category deleted'); renderAdmin('categories');
}
function adminOrders(){
  return `
  <div class="admin-topbar"><h2 class="serif" style="font-size:26px;">Order Management</h2></div>
  <div class="admin-panel" style="padding:0;">
    <table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
    <tbody>${DB.orders.map(o=>`
      <tr>
        <td class="mono">#${o.id}</td>
        <td>${o.shipping.name||'Guest'}</td>
        <td>${o.items.length}</td>
        <td class="mono">${money(o.total)}</td>
        <td><select onchange="updateOrderStatus('${o.id}',this.value)">
          ${['Pending','Processing','Shipped','Delivered'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
      </tr>`).join('') || `<tr><td colspan="5">No orders placed yet.</td></tr>`}</tbody>
    </table>
  </div>`;
}
async function updateOrderStatus(id,status){
  const o = DB.orders.find(x=>x.id===id); o.status=status; await saveDB(); toast('Order status updated ✓');
}
function adminCustomers(){
  return `
  <div class="admin-topbar"><h2 class="serif" style="font-size:26px;">Customer Management</h2></div>
  <div class="admin-panel" style="padding:0;">
    <table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th></tr></thead>
    <tbody>${DB.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||'—'}</td><td>${DB.orders.filter(o=>o.userId===u.id).length}</td></tr>`).join('')}</tbody></table>
  </div>`;
}
function adminReviews(){
  return `
  <div class="admin-topbar"><h2 class="serif" style="font-size:26px;">Review Management</h2></div>
  <div class="admin-panel" style="padding:0;">
    <table class="admin-table"><thead><tr><th>Product</th><th>Rating</th><th>Comment</th><th>Customer</th><th></th></tr></thead>
    <tbody>${DB.reviews.length?DB.reviews.map((r,i)=>`
      <tr><td>${findProduct(r.productId)?.title||'—'}</td><td>${stars(r.rating)}</td><td>${r.comment}</td><td>${r.userName}</td>
      <td><a class="icon-link danger" onclick="removeReview(${i})">Remove</a></td></tr>`).join(''):`<tr><td colspan="5">No reviews submitted yet.</td></tr>`}</tbody></table>
  </div>`;
}
async function removeReview(i){ DB.reviews.splice(i,1); await saveDB(); toast('Review removed'); renderAdmin('reviews'); }

/* ---------------- ROUTER ---------------- */
function renderRoute(){
  const hash = location.hash || '#/home';
  const parts = hash.replace('#/','').split('/');
  const route = parts[0];
  window.scrollTo(0,0);
  renderHeader();
  document.body.classList.toggle('is-admin', route==='admin');
  $('#site-header').style.display = route==='admin'?'none':'';
  $('#site-footer').style.display = route==='admin'?'none':'';

  if(route===''||route==='home') renderHome();
  else if(route==='category') renderListing(DB.categories.find(c=>c.id===parts[1])?.name||'Category', DB.products.filter(p=>p.category===parts[1]));
  else if(route==='new') renderListing('New Arrivals', DB.products.filter(p=>p.tags.includes('new')));
  else if(route==='sale') renderListing('Sale', DB.products.filter(p=>p.tags.includes('sale')));
  else if(route==='search') renderListing('Search: "'+decodeURIComponent(parts[1])+'"', DB.products.filter(p=>(p.title+p.categoryName+p.colors.join(' ')).toLowerCase().includes(decodeURIComponent(parts[1]).toLowerCase())));
  else if(route==='product') renderProduct(parts[1]);
  else if(route==='cart') renderCart();
  else if(route==='checkout') renderCheckout();
  else if(route==='order-success') renderOrderSuccess(parts[1]);
  else if(route==='login') renderAuth('login');
  else if(route==='signup') renderAuth('signup');
  else if(route==='forgot') renderAuth('forgot');
  else if(route==='profile') renderProfile(parts[1]);
  else if(route==='support') renderStatic(parts[1]);
  else if(route==='admin') renderAdmin(parts[1]);
  else renderHome();
}
window.addEventListener('hashchange', renderRoute);

/* ---------------- INIT ---------------- */
(async function init(){
  await loadStorage();
  renderFooter();
  renderRoute();
})();
</script>
